name: Release

# Builds INKMYNOVEL for Windows + macOS (Apple Silicon & Intel) and
# publishes a GitHub Release.
# Trigger: push a version tag, e.g.  git tag v1.0.0 && git push origin v1.0.0
# (workflow_dispatch runs the builds for testing without publishing.)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Stamp release version
        shell: bash
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      - name: Build INKMYNOVEL.exe
        run: python -m PyInstaller --noconfirm --clean INKMYNOVEL.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: INKMYNOVEL-windows
          path: dist/INKMYNOVEL.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Stamp release version
        shell: bash
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      # Build a universal2 app so one .dmg runs natively on both
      # Intel and Apple Silicon Macs (no scarce Intel runner needed).
      - name: Build INKMYNOVEL.app (universal2)
        env:
          INKMYNOVEL_TARGET_ARCH: universal2
        run: python -m PyInstaller --noconfirm --clean INKMYNOVEL.spec

      - name: Package as .dmg
        run: |
          mkdir -p dist/dmg
          cp -R dist/INKMYNOVEL.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create \
            -volname INKMYNOVEL \
            -srcfolder dist/dmg \
            -ov -format UDZO \
            dist/INKMYNOVEL.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: INKMYNOVEL-macos
          path: dist/INKMYNOVEL.dmg

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    # Publish as long as Windows built — don't let a macOS hiccup block it.
    if: always() && needs.build-windows.result == 'success' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          name: INKMYNOVEL ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
