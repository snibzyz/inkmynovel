name: Release

# Builds InkMyNovel for Windows + macOS (Apple Silicon & Intel) and
# publishes a GitHub Release.
# Trigger: push a version tag, e.g.  git tag v1.0.0 && git push origin v1.0.0
# (workflow_dispatch runs the builds for testing without publishing.)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build InkMyNovel.exe
        run: python -m PyInstaller --noconfirm --clean InkMyNovel.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: InkMyNovel-windows
          path: dist/InkMyNovel.exe

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest   # Apple Silicon (M-series)
            arch: arm64
          - runner: macos-13       # Intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build InkMyNovel.app
        run: python -m PyInstaller --noconfirm --clean InkMyNovel.spec

      - name: Package as .dmg
        run: |
          mkdir -p dist/dmg
          cp -R dist/InkMyNovel.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create \
            -volname InkMyNovel \
            -srcfolder dist/dmg \
            -ov -format UDZO \
            dist/InkMyNovel-${{ matrix.arch }}.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: InkMyNovel-macos-${{ matrix.arch }}
          path: dist/InkMyNovel-${{ matrix.arch }}.dmg

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          name: InkMyNovel ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
